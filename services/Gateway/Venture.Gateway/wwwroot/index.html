<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Venture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=Nunito:wght@400..800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            venture: {
              bg: "#0a0c10",
              card: "#11141d",
              border: "#1e2433",
              accent: "#3b82f6",
              muted: "#94a3b8",
            },
          },
          fontFamily: {
            sans: ['"Comfortaa"', "system-ui", "sans-serif"],
            heading: ['"Comfortaa"', "system-ui", "sans-serif"],
          },
          borderRadius: {
            xl2: "1rem",
          },
        },
      },
    };
  </script>
  <script>
    (function () {
      try {
        if (localStorage.getItem("venture.theme") === "light") {
          document.documentElement.setAttribute("data-theme", "light");
          document.documentElement.classList.add("theme-light");
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="font-sans antialiased">
  <div id="app"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
